<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Riella AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen chat app. Bot identity header on top, optional personality panel under it, a scrolling thread, and the composer pinned to the bottom. */
:root {
  --bg: #EDF1F4;
  --surface: #FFFFFF;
  --surface-2: #E1E8ED;
  --fg: #13202B;
  --muted: #566877;
  --line: #D0D9E0;
  --accent: #0B7A85;
  --on-accent: #FFFFFF;
  --danger: #B3261E;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151B;
    --surface: #17202A;
    --surface-2: #212D39;
    --fg: #E7EDF2;
    --muted: #93A4B3;
    --line: #2A3743;
    --accent: #52C4CE;
    --on-accent: #08242A;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151B;
  --surface: #17202A;
  --surface-2: #212D39;
  --fg: #E7EDF2;
  --muted: #93A4B3;
  --line: #2A3743;
  --accent: #52C4CE;
  --on-accent: #08242A;
  --danger: #FF8A80;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 var(--font-body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 760px;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-block: 12px;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
  font: 700 20px/1 var(--font-display);
}
.who { flex: 1; min-width: 0; }
.who h1 { margin: 0; font: 700 19px/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who p { margin: 3px 0 0; font: 500 11px/1 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.actions { display: flex; gap: 8px; }
.btn {
  font: 600 13px/1 var(--font-body); padding: 9px 12px;
  color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible, .opt input:focus-visible + span {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* Personality panel */
.panel { display: grid; gap: 14px; margin-top: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.cap { display: block; margin-bottom: 5px; font: 500 11px/1 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
.panel textarea { min-height: 104px; resize: vertical; }
.chips, .seg { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .opt span {
  display: inline-block; font: 500 13px/1 var(--font-body); padding: 8px 11px;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
}
.chip:hover, .opt span:hover { border-color: var(--accent); }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.panel-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Thread */
.thread { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; flex-direction: column; max-width: 88%; min-width: 0; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot { align-self: flex-start; align-items: flex-start; }
.bubble { padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; min-width: 0; max-width: 100%; }
.user .bubble { background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.interrupted .bubble { opacity: .75; }
.bubble p { margin: 0 0 .6em; white-space: pre-wrap; }
.bubble p.h { font-weight: 600; }
.bubble > :last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 0 0 .6em; padding-left: 1.3em; }
.bubble li + li { margin-top: .2em; }
.bubble code { font: 13px/1.4 var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.bubble pre { margin: 0 0 .6em; overflow-x: auto; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; }
.bubble pre code { background: none; padding: 0; }
.meta { display: flex; gap: 10px; margin-top: 4px; font: 400 11px/1 var(--font-mono); color: var(--muted); }
.link { font: inherit; color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--accent); }
.thinking { color: var(--muted); }
.dots i { display: inline-block; width: 5px; height: 5px; margin-left: 3px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }

.note { align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--danger); border-radius: 8px; padding: 9px 12px; }
.note.info { border-left-color: var(--accent); }
.banner { margin: 0 0 10px; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--danger); border-radius: 8px; padding: 9px 12px; }

/* Empty state */
.empty { margin: auto 0; display: grid; gap: 14px; justify-items: start; }
.empty h2 { margin: 0; font: 700 clamp(28px, 6vw, 38px)/1.05 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.empty p { margin: 0; color: var(--muted); max-width: 48ch; }
.empty .fine { font-size: 13px; }
.starters { display: grid; gap: 8px; width: 100%; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.starter { text-align: left; font: 500 14px/1.35 var(--font-body); padding: 11px 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.starter:hover { border-color: var(--accent); }

/* Composer */
.composer { display: flex; gap: 8px; align-items: flex-end; padding-top: 12px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 160px; resize: none; border-radius: 12px; background: var(--surface); }
.send { flex: none; height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: 600 14px/1 var(--font-body); cursor: pointer; }
.send.stop { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }

@media (max-width: 480px) {
  .top { flex-wrap: wrap; }
  .actions { order: 3; width: 100%; }
  .actions .btn { flex: 1; }
  .msg { max-width: 94%; }
}
</style>

<div class="app">
  <header class="top">
    <div class="avatar" id="avatar" aria-hidden="true">R</div>
    <div class="who">
      <h1 id="botName">Riella</h1>
      <p id="botMode">Fast mode</p>
    </div>
    <div class="actions">
      <button class="btn" id="btnPersona" type="button" aria-expanded="false" aria-controls="panel">Personality</button>
      <button class="btn" id="btnNew" type="button">New chat</button>
    </div>
  </header>

  <section class="panel" id="panel" hidden aria-label="Personality settings">
    <div>
      <label class="cap" for="fName">Name</label>
      <input type="text" id="fName" maxlength="40" autocomplete="off">
    </div>
    <div>
      <label class="cap" for="fPersona">How it talks and what it does</label>
      <textarea id="fPersona" maxlength="2000"></textarea>
    </div>
    <div>
      <span class="cap">Start from a preset</span>
      <div class="chips" id="presets"></div>
    </div>
    <div>
      <span class="cap" id="tierCap">Reply style</span>
      <div class="seg" role="radiogroup" aria-labelledby="tierCap">
        <label class="opt"><input type="radio" name="tier" value="quick"><span>Fast</span></label>
        <label class="opt"><input type="radio" name="tier" value="default"><span>Balanced</span></label>
        <label class="opt"><input type="radio" name="tier" value="complex"><span>Deep</span></label>
      </div>
      <p class="hint" id="tierHint"></p>
    </div>
    <div class="panel-foot">
      <span class="hint" style="margin:0">Changes apply to your next message and are saved in this browser.</span>
      <button class="btn" id="btnDone" type="button">Done</button>
    </div>
  </section>

  <main class="thread" id="thread" role="log" aria-label="Conversation"></main>
  <div class="banner" id="banner" hidden></div>

  <form class="composer" id="composer">
    <label class="sr" for="input">Message</label>
    <textarea id="input" rows="1" placeholder="Message Riella"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'riella-chat-v1';
  var TIERS = { quick: 'Fast', 'default': 'Balanced', complex: 'Deep' };
  var TIER_HINTS = {
    quick: 'Starts replying almost at once. Good for everyday chat.',
    'default': 'Thinks briefly before answering. Better for explanations and writing.',
    complex: 'Thinks the longest. Best for hard problems, and the slowest to start.'
  };
  var PRESETS = [
    { label: 'Friendly buddy', name: 'Riella', persona: 'You talk casually and warmly, like a smart friend. Keep answers short unless I ask for more. Explain things simply, with small examples. Reply in the language I write in, including Taglish if I mix languages.' },
    { label: 'Study coach', name: 'Coach', persona: 'You are a patient study coach. Explain one step at a time, then check my understanding with a short question. When I ask for practice, quiz me one question at a time and wait for my answer.' },
    { label: 'Writing helper', name: 'Quill', persona: 'You help me write and edit. Give direct feedback, show an improved version of my text, and say briefly what you changed. Keep my own voice instead of replacing it.' },
    { label: 'Straight talker', name: 'Rex', persona: 'You are blunt and concise. Give the answer first, then at most three short reasons. Say plainly when you are not sure.' }
  ];
  var STARTERS = [
    'Explain something I find confusing, in simple words',
    'Help me plan my week',
    'Quiz me on a topic I pick',
    'Help me write a message I keep putting off'
  ];

  var state = { name: PRESETS[0].name, persona: PRESETS[0].persona, tier: 'quick', turns: [] };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      if (typeof saved.name === 'string') state.name = saved.name.slice(0, 40);
      if (typeof saved.persona === 'string') state.persona = saved.persona.slice(0, 2000);
      if (TIERS[saved.tier]) state.tier = saved.tier;
      if (Array.isArray(saved.turns)) {
        state.turns = saved.turns.filter(function (t) {
          return t && (t.role === 'user' || t.role === 'assistant') && typeof t.content === 'string' && t.content;
        });
      }
    }
  } catch (e) { /* storage unavailable: start fresh */ }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  var $ = function (id) { return document.getElementById(id); };
  var thread = $('thread'), input = $('input'), sendBtn = $('send'), banner = $('banner');
  var sample = null, busy = false, ctl = null, epoch = 0, pinned = true, newTimer = null;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function botName() { return (state.name || '').trim() || 'Riella'; }

  /* ---------- Safe, minimal markdown ---------- */
  function inline(parent, text) {
    var re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.append(text.slice(last, m.index));
      if (m[1]) { parent.append(el('code', null, m[1].slice(1, -1))); }
      else { parent.append(el('strong', null, m[2].slice(2, -2))); }
      last = re.lastIndex;
    }
    if (last < text.length) parent.append(text.slice(last));
  }
  function blocks(root, text) {
    var lines = text.split('\n'), para = [], list = null;
    function flushPara() {
      if (!para.length) return;
      var p = el('p'); inline(p, para.join('\n')); root.append(p); para = [];
    }
    lines.forEach(function (line) {
      var li = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line);
      if (li) {
        flushPara();
        var ordered = /^\s*\d/.test(line);
        if (!list || list.ordered !== ordered) {
          list = { ordered: ordered, node: el(ordered ? 'ol' : 'ul') };
          root.append(list.node);
        }
        var item = el('li'); inline(item, li[1]); list.node.append(item);
        return;
      }
      if (!line.trim()) { flushPara(); return; }
      list = null;
      var h = /^#{1,6}\s+(.*)$/.exec(line);
      if (h) { flushPara(); var hp = el('p', 'h'); inline(hp, h[1]); root.append(hp); return; }
      para.push(line);
    });
    flushPara();
  }
  function renderMd(root, text) {
    root.textContent = '';
    var parts = text.split('```');
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (i % 2 === 1) {
        var nl = part.indexOf('\n'), code = part;
        if (nl > -1 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim())) code = part.slice(nl + 1);
        var pre = el('pre');
        pre.append(el('code', null, code.replace(/\n$/, '')));
        root.append(pre);
      } else {
        blocks(root, part);
      }
    }
  }

  /* ---------- Thread ---------- */
  function scrollDown() { thread.scrollTop = thread.scrollHeight; }
  function stick() { if (pinned) scrollDown(); }
  thread.addEventListener('scroll', function () {
    pinned = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
  });

  function addMsg(role, text, pending) {
    var row = el('div', 'msg ' + (role === 'user' ? 'user' : 'bot'));
    var body = el('div', 'bubble');
    row.append(body);
    if (role === 'user') {
      body.textContent = text;
    } else if (!pending) {
      renderMd(body, text);
      addMeta(row, body, text);
    }
    thread.append(row);
    return { row: row, body: body };
  }
  function addMeta(row, body, text) {
    var meta = el('div', 'meta');
    var copy = el('button', 'link', 'Copy');
    copy.type = 'button';
    copy.addEventListener('click', function () { copyText(text, copy, body); });
    meta.append(copy);
    row.append(meta);
  }
  function selectNode(node) {
    try {
      var r = document.createRange(); r.selectNodeContents(node);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) { /* ignore */ }
  }
  function copyText(text, btn, body) {
    var flash = function (label) {
      btn.textContent = label;
      setTimeout(function () { btn.textContent = 'Copy'; }, 1600);
    };
    var fallback = function () { selectNode(body); flash('Selected'); };
    try {
      navigator.clipboard.writeText(text).then(function () { flash('Copied'); }, fallback);
    } catch (e) { fallback(); }
  }
  function setThinking(body) {
    body.textContent = '';
    var s = el('span', 'thinking', 'Thinking');
    var d = el('span', 'dots');
    d.append(el('i'), el('i'), el('i'));
    s.append(d);
    body.append(s);
  }
  function clearNotes() {
    Array.prototype.forEach.call(thread.querySelectorAll('.note'), function (n) { n.remove(); });
  }
  function addNote(text, retry, info, onRetry) {
    var n = el('div', 'note' + (info ? ' info' : ''));
    n.append(el('span', null, text));
    if (retry) {
      var b = el('button', 'btn', 'Try again');
      b.type = 'button';
      b.addEventListener('click', onRetry);
      n.append(b);
    }
    thread.append(n);
    scrollDown();
  }

  function renderEmpty() {
    var box = el('div', 'empty');
    box.append(el('h2', null, 'Hi, I’m ' + botName() + '.'));
    box.append(el('p', null, 'This is your own chatbot. Ask me anything, or change how I talk under Personality.'));
    var wrap = el('div', 'starters');
    STARTERS.forEach(function (t) {
      var b = el('button', 'starter', t);
      b.type = 'button';
      b.addEventListener('click', function () { send(t); });
      wrap.append(b);
    });
    box.append(wrap);
    box.append(el('p', 'fine', 'Chats are stored in this browser. Messages are sent to the AI provider to generate replies. Avoid sharing sensitive information.'));
    thread.append(box);
  }
  function renderAll() {
    thread.textContent = '';
    if (!state.turns.length) { renderEmpty(); return; }
    state.turns.forEach(function (t) { addMsg(t.role, t.content); });
    pinned = true;
    scrollDown();
  }

  /* ---------- Secure Gemini backend ---------- */
  function rules() {
    return 'Your name is ' + botName() + '. ' + state.persona.trim();
  }
  function setBusy(on) {
    busy = on;
    sendBtn.textContent = on ? 'Stop' : 'Send';
    sendBtn.classList.toggle('stop', on);
    sendBtn.type = on ? 'button' : 'submit';
  }
  function showBanner(text) { banner.textContent = text; banner.hidden = false; }
  async function generate() {
    if (busy) return;
    clearNotes(); banner.hidden = true;
    var ep = epoch;
    setBusy(true);
    var m = addMsg('assistant', '', true);
    setThinking(m.body);
    scrollDown();
    ctl = new AbortController();
    try {
      var response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: state.turns.slice(-20),
          persona: rules(),
          tier: state.tier
        }),
        signal: ctl.signal
      });
      var result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Could not connect to Riella.');
      if (ep !== epoch) return;
      var answer = result.text || 'No response was generated.';
      state.turns.push({ role: 'assistant', content: answer });
      save(); renderMd(m.body, answer); addMeta(m.row, m.body, answer); stick();
    } catch (e) {
      if (ep !== epoch) return;
      m.row.remove();
      if (e.name !== 'AbortError') addNote(e.message || 'Connection error.', true, false, generate);
    } finally {
      ctl = null;
      if (ep === epoch) setBusy(false);
    }
  }
  function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    if (text.length > 8000) { showBanner('Please keep messages under 8,000 characters.'); return; }
    clearNotes();
    if (!state.turns.length) thread.textContent = '';
    state.turns.push({ role: 'user', content: text });
    save(); addMsg('user', text);
    input.value = ''; autosize(); pinned = true; scrollDown(); generate();
  }

  /* ---------- Controls ---------- */
  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(input.value);
    }
  });
  $('composer').addEventListener('submit', function (e) { e.preventDefault(); send(input.value); });
  sendBtn.addEventListener('click', function () { if (busy && ctl) ctl.abort(); });

  var btnNew = $('btnNew');
  function disarm() { clearTimeout(newTimer); newTimer = null; btnNew.textContent = 'New chat'; }
  btnNew.addEventListener('click', function () {
    if (!state.turns.length && !busy) return;
    if (!newTimer) { btnNew.textContent = 'Clear chat?'; newTimer = setTimeout(disarm, 3000); return; }
    disarm();
    epoch++;
    if (ctl) ctl.abort();
    setBusy(false);
    state.turns = [];
    save();
    renderAll();
  });

  var panel = $('panel'), btnPersona = $('btnPersona');
  function togglePanel(open) {
    panel.hidden = !open;
    btnPersona.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btnPersona.addEventListener('click', function () { togglePanel(panel.hidden); });
  $('btnDone').addEventListener('click', function () { togglePanel(false); });

  function applyHeader() {
    var n = botName();
    $('botName').textContent = n;
    $('avatar').textContent = n.charAt(0).toUpperCase();
    $('botMode').textContent = TIERS[state.tier] + ' mode';
    input.placeholder = 'Message ' + n;
    $('tierHint').textContent = TIER_HINTS[state.tier];
    document.title = n + ' AI';
    if (!state.turns.length && !busy) renderAll();
  }
  var fName = $('fName'), fPersona = $('fPersona');
  fName.value = state.name;
  fPersona.value = state.persona;
  fName.addEventListener('input', function () { state.name = fName.value; save(); applyHeader(); });
  fPersona.addEventListener('input', function () { state.persona = fPersona.value; save(); });

  var presetBox = $('presets');
  PRESETS.forEach(function (p) {
    var b = el('button', 'chip', p.label);
    b.type = 'button';
    b.addEventListener('click', function () {
      state.name = p.name; state.persona = p.persona;
      fName.value = p.name; fPersona.value = p.persona;
      save(); applyHeader();
    });
    presetBox.append(b);
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="tier"]'), function (r) {
    r.checked = r.value === state.tier;
    r.addEventListener('change', function () {
      if (r.checked) { state.tier = r.value; save(); applyHeader(); }
    });
  });

  applyHeader();
  renderAll();
})();
</script>

</body></html>
